[profile.default]
src = "src"
out = "out"
libs = ["lib", "dependencies"]
via_ir = true
optimizer = true
fs_permissions = [
 { access = "read", path = "config/deployments.toml" }
]

remappings = [
  "forge-std/=dependencies/forge-std-1.16.2/src/",
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.7.0/"
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
[dependencies]
forge-std = "1.16.2"
"@openzeppelin-contracts" = "5.7.0"

[rpc_endpoints]
 linea-rpc-url = "${LINEA_RPC_URL}"
 linea-sepolia-rpc-url = "${LINEA_SEPOLIA_RPC_URL}"

[etherscan]
 linea-key = { url = "https://api.etherscan.io/v2/api?chainid=59144", key = "${ETHERSCAN_API_KEY}" }
 linea-sepolia-key = { url = "https://api.etherscan.io/v2/api?chainid=59141", key = "${ETHERSCAN_API_KEY}" }
